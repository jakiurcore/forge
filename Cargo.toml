[workspace]
members = ["crates/forge-core", "crates/forge-cli", "crates/forge-process", "crates/forge-concurrency", "crates/forge-memory", "crates/forge-network"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/nprime/forge"
authors = ["Forge Contributors"]

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
chrono = "0.4"
nix = { version = "0.29", features = ["process", "signal", "fs"] }
libc = "0.2"
